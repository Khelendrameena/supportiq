[pytest]
DJANGO_SETTINGS_MODULE = supportiq.settings
pythonpath = backend
testpaths = backend evals
addopts = -q
# Third-party noise: DRF re-registers its own format-suffix converter at
# import time (RemovedInDjango60Warning inside djangorestframework itself).
# Nothing in this repo triggers it; ignore it so real warnings stay visible.
filterwarnings =
    ignore:Converter 'drf_format_suffix' is already registered:django.utils.deprecation.RemovedInDjango60Warning
