# CI: backend tests (Postgres+pgvector+Redis), eval harness (SQLite),
# frontend build. Runs on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: supportiq
          POSTGRES_DB: supportiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportiq -d supportiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://supportiq:supportiq@localhost:5432/supportiq
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Prepare database (least-privilege role + pgvector in template1)
        # The image's POSTGRES_USER is a superuser, and superusers bypass
        # row-level security entirely -- the RLS tests would pass/fail for
        # the wrong reasons. Demote it and put the vector extension in
        # template1 so pytest's test database inherits it (the kb migration
        # runs CREATE EXTENSION IF NOT EXISTS as a harmless no-op there).
        run: |
          psql "$DATABASE_URL" -c "ALTER USER supportiq NOSUPERUSER;"
          psql "$DATABASE_URL" -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run backend tests (includes Postgres RLS tests)
        run: python -m pytest backend -q

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run eval harness (SQLite, deterministic providers)
        run: python -m pytest evals -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
